<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>IntelliJ New UI Themes for Orca</title>
  <!--
    In the style of JetBrains product icons (a black plate with a two-letter code and an
    underscore bar on a gradient), deliberately not the IntelliJ IDEA logo: the code is "UI"
    and the gradient uses the New UI accent colors.
  -->
  <defs>
    <radialGradient id="glow-blue" cx="0.18" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#3574F0"/>
      <stop offset="1" stop-color="#3574F0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-orange" cx="0.88" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#FF8A3D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-pink" cx="0.92" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#FF3D8B"/>
      <stop offset="1" stop-color="#FF3D8B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="32" y="32" width="448" height="448" rx="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="32" y="32" width="448" height="448" fill="#7B4CF0"/>
    <rect x="32" y="32" width="448" height="448" fill="url(#glow-pink)"/>
    <rect x="32" y="32" width="448" height="448" fill="url(#glow-orange)"/>
    <rect x="32" y="32" width="448" height="448" fill="url(#glow-blue)"/>
  </g>

  <!-- Black plate -->
  <rect x="112" y="112" width="288" height="288" fill="#000000"/>

  <!-- "U" -->
  <path d="M148 150 h30 v84 a26 26 0 0 0 52 0 v-84 h30 v84 a56 56 0 0 1 -112 0 z" fill="#FFFFFF"/>
  <!-- "I" -->
  <rect x="284" y="150" width="30" height="140" fill="#FFFFFF"/>

  <!-- Underscore bar -->
  <rect x="148" y="338" width="108" height="22" fill="#FFFFFF"/>
</svg>
