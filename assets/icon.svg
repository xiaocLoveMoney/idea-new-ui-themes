<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>IntelliJ New UI Themes for Orca</title>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34363C"/>
      <stop offset="1" stop-color="#232528"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#548AF7"/>
      <stop offset="1" stop-color="#3574F0"/>
    </linearGradient>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Window frame: the lighter "Islands" chrome -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#frame)"/>
  <rect x="24.5" y="24.5" width="463" height="463" rx="103.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Title bar dots -->
  <circle cx="92" cy="86" r="9" fill="#5F6269"/>
  <circle cx="120" cy="86" r="9" fill="#5F6269"/>
  <circle cx="148" cy="86" r="9" fill="#5F6269"/>

  <!-- Left tool-window island -->
  <rect x="68" y="116" width="104" height="328" rx="26" fill="#1B1C1F" filter="url(#lift)"/>
  <rect x="88" y="144" width="64" height="14" rx="7" fill="#43454A"/>
  <rect x="88" y="174" width="64" height="22" rx="8" fill="#2E436E"/>
  <rect x="96" y="181" width="40" height="8" rx="4" fill="#99BBFF"/>
  <rect x="88" y="212" width="52" height="14" rx="7" fill="#43454A"/>
  <rect x="88" y="242" width="60" height="14" rx="7" fill="#43454A"/>
  <rect x="88" y="272" width="44" height="14" rx="7" fill="#43454A"/>

  <!-- Editor island -->
  <rect x="188" y="116" width="256" height="328" rx="26" fill="#1B1C1F" filter="url(#lift)"/>
  <!-- Active tab with the New UI underline -->
  <rect x="210" y="138" width="88" height="12" rx="6" fill="#DFE1E5"/>
  <rect x="210" y="160" width="88" height="6" rx="3" fill="url(#accent)"/>
  <rect x="316" y="138" width="64" height="12" rx="6" fill="#5F6269"/>

  <!-- Code in the IntelliJ Dark scheme colors -->
  <rect x="210" y="196" width="58" height="14" rx="7" fill="#CF8E6D"/>
  <rect x="278" y="196" width="80" height="14" rx="7" fill="#56A8F5"/>
  <rect x="368" y="196" width="34" height="14" rx="7" fill="#BCBEC4"/>

  <rect x="232" y="228" width="46" height="14" rx="7" fill="#C77DBB"/>
  <rect x="288" y="228" width="96" height="14" rx="7" fill="#6AAB73"/>

  <rect x="232" y="260" width="58" height="14" rx="7" fill="#CF8E6D"/>
  <rect x="300" y="260" width="40" height="14" rx="7" fill="#2AACB8"/>
  <rect x="350" y="260" width="52" height="14" rx="7" fill="#BCBEC4"/>

  <rect x="232" y="292" width="120" height="14" rx="7" fill="#7A7E85"/>

  <rect x="210" y="324" width="34" height="14" rx="7" fill="#BCBEC4"/>

  <rect x="210" y="368" width="70" height="14" rx="7" fill="#B3AE60"/>
  <rect x="290" y="368" width="64" height="14" rx="7" fill="#56A8F5"/>
  <rect x="232" y="400" width="104" height="14" rx="7" fill="#6AAB73"/>
</svg>
